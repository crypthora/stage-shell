<!doctype html><meta charset="utf-8"><style>
:root{color-scheme:light dark;--surface:#f7f9fc;--text:#1b1d22;--outline:#68707d;--shadow:rgba(30,36,48,.20)}@media (prefers-color-scheme:dark){:root{--surface:#1a1b20;--text:#f0f3f8;--outline:#a8b0bd;--shadow:rgba(0,0,0,.34)}}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--surface);font-family:"Segoe UI",sans-serif}body{display:grid;place-items:center}.card{display:none;width:100%;height:100%;align-items:center;gap:12px;padding:13px 18px;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 62%,var(--outline));box-shadow:0 12px 34px var(--shadow);color:var(--text)}.card.visible{display:flex}.mic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);font-size:19px}.listening .mic{animation:pulse 1s infinite}.text,.draft{font:14px/1.35 "Segoe UI",sans-serif;min-width:0;flex:1}.text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.draft{display:none;border:0;border-bottom:1px solid color-mix(in srgb,var(--accent) 65%,var(--outline));outline:0;padding:5px 2px;background:transparent;color:var(--text);resize:none}.editing .text{display:none}.editing .draft{display:block}@keyframes pulse{50%{transform:scale(1.12);opacity:.72}}
</style><div id="card" class="card"><div class="mic">🎙</div><div id="text" class="text"></div><textarea id="draft" class="draft" rows="1" aria-label="识别结果，按 Enter 输入"></textarea></div><script>document.title='Outputs Electron Voice Overlay';const c=document.querySelector('#card'),t=document.querySelector('#text'),d=document.querySelector('#draft');let mode='',serverText='',saveTimer;async function commit(){const text=d.value.trim();if(!text)return;d.disabled=true;try{const r=await fetch('http://127.0.0.1:7798/v1/voice/commit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw new Error(await r.text())}catch{d.disabled=false}}d.addEventListener('input',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(()=>void fetch('http://127.0.0.1:7798/v1/voice/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:d.value})}),40)});d.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();void commit()}if(e.key==='Escape'){e.preventDefault();void fetch('http://127.0.0.1:7798/v1/voice/cancel',{method:'POST'})}});async function q(){try{const r=await fetch('http://127.0.0.1:7798/v1/voice/state',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json(),nextMode=s.overlay?.mode||'',nextText=s.overlay?.text||'';document.documentElement.style.setProperty('--accent',s.theme||'#4aa3ff');c.className='card '+(s.overlay?.visible?'visible ':'')+nextMode;t.textContent=nextText;if(nextMode==='editing'&&(mode!=='editing'||serverText!==nextText)){d.value=nextText;d.disabled=false;setTimeout(()=>{d.focus();d.setSelectionRange(d.value.length,d.value.length)},0)}mode=nextMode;serverText=nextText}catch{}}setInterval(q,120);q()</script>
