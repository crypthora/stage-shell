<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音输入</title>
    <style>
      :root { --surface:#f7f9fc; --titlebar:#fff; --title-text:#1b1d22; --active-title:#fff8db; }
      html, body { width:100%; height:100%; margin:0; overflow:hidden; }
      body { display:grid; grid-template-rows:38px minmax(0, 1fr); background:var(--surface); color:var(--title-text); }
      .titlebar { display:flex; align-items:center; min-width:0; background:var(--titlebar); border-bottom:1px solid #00000012; -webkit-app-region:drag; user-select:none; }
      body.active .titlebar { background:var(--active-title); }
      .title { flex:1; min-width:0; padding:0 12px; font:600 13px/38px "Segoe UI", "Microsoft YaHei", sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .menu-wrap { position:relative; height:38px; -webkit-app-region:no-drag; }
      .window-action { width:34px; height:38px; padding:0; border:0; background:transparent; color:inherit; font-size:18px; line-height:1; cursor:pointer; -webkit-app-region:no-drag; display:flex; align-items:center; justify-content:center; }
      .window-action .material-symbols-outlined { display:block; font-size:18px; line-height:18px; }
      .window-action:hover { background:#00000012; }
      .window-action.close:hover { background:#c42b1c; color:#fff; }
      .window-menu { display:none; position:absolute; z-index:10; top:34px; right:2px; min-width:132px; padding:4px; background:var(--titlebar); border:1px solid #00000020; border-radius:7px; box-shadow:0 8px 22px #0000002b; }
      .menu-wrap.open .window-menu { display:block; }
      .window-menu button { width:100%; padding:7px 10px; border:0; border-radius:4px; background:transparent; color:inherit; font:13px "Segoe UI", "Microsoft YaHei", sans-serif; text-align:left; cursor:pointer; }
      .window-menu button:hover { background:#00000012; }
      #editor, .cm-editor, .cm-scroller { width:100%; height:100%; margin:0; padding:0; border:0; }
      #editor, .cm-editor { overflow:hidden; }
      .cm-scroller { overflow: auto; }
      #editor { display: flex; }
      #editor > .cm-editor { flex: 1 1 auto; min-width: 0; min-height: 0; }
    </style>
  </head>
  <body class="active">
    <div class="titlebar">
      <div class="title">语音便笺</div>
      <div id="window-menu-wrap" class="menu-wrap">
        <button id="window-menu-button" class="window-action" title="窗口菜单" aria-label="窗口菜单" aria-expanded="false"><span class="material-symbols-outlined">menu</span></button>
        <div class="window-menu" role="menu"><button id="center-window" role="menuitem">窗口居中</button></div>
      </div>
      <button id="close-window" class="window-action close" title="关闭"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="editor"></div>
    <script type="module" src="/src/voice-editor.ts"></script>
  </body>
</html>
